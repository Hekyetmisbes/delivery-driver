</style></head><body><header><div class="brand">DELIVERY <b>DRIVER</b> <span style="font-weight:400;color:#92a8b5">/ UI Kit</span></div><div class="subtitle">52 ekran • düzenlenebilir SVG • raster PNG • Unity görsel entegrasyon referansı</div><div class="tool"><input id="search" class="search" placeholder="Ekran veya Unity sınıfı ara..." aria-label="Ekran ara"><div class="tabs" id="tabs"></div><span class="count" id="counter"></span></div></header><main><div class="notice">Ekranlar konsept yerleşimlerdir. Oyun verileri örnektir; çalışan Unity prefabı veya derlenmiş C# davranışı değildir. <a class="a" href="../README_TR.md">Paketi okumak için README</a></div><div class="grid" id="grid"></div></main><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Görsel önizleme"><div class="sheet"><img id="large" alt=""><div class="foot"><b id="modTitle"></b><small id="modScript"></small><a class="a" id="openSVG" target="_blank">SVG aç / düzenle</a><button class="action" id="prev">← Önceki</button><button class="action" id="next">Sonraki →</button><button class="action" id="close">Kapat (ESC)</button></div></div></div>

scripts": "SmartphoneNotificationToast"}, {"id": "balance_reward", "name": "Bakiye Değişimi", "category": "07_Progression", "cn": "İlerleme", "png": "../01_Screens/PNG/07_Progression/balance_reward.png", "svg": "../01_Screens/SVG/07_Progression/balance_reward.svg", "scripts": "BalanceHudUI"}, {"id": "level_up", "name": "Seviye Atlama", "category": "07_Progression", "cn": "İlerleme", "png": "../01_Screens/PNG/07_Progression/level_up.png", "svg": "../01_Screens/SVG/07_Progression/level_up.svg", "scripts": "ProgressionUI"}, {"id": "skill_tree", "name": "Yetenek Ağacı", "category": "07_Progression", "cn": "İlerleme", "png": "../01_Screens/PNG/07_Progression/skill_tree.png", "svg": "../01_Screens/SVG/07_Progression/skill_tree.svg", "scripts": "ProgressionSkillTreeUI"}, {"id": "achievement_unlocked", "name": "Başarım", "category": "07_Progression", "cn": "İlerleme", "png": "../01_Screens/PNG/07_Progression/achievement_unlocked.png", "svg": "../01_Screens/SVG/07_Progression/achievement_unlocked.svg", "scripts": "AchievementNotificationUI"}, {"id": "notification_center", "name": "Bildirim Kuyruğu", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/notification_center.png", "svg": "../01_Screens/SVG/08_World_System/notification_center.svg", "scripts": "NotificationQueue"}, {"id": "confirmation_dialog", "name": "Onay Diyaloğu", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/confirmation_dialog.png", "svg": "../01_Screens/SVG/08_World_System/confirmation_dialog.svg", "scripts": "ConfirmationDialog"}, {"id": "tooltip_state", "name": "Bilgi İpucu", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/tooltip_state.png", "svg": "../01_Screens/SVG/08_World_System/tooltip_state.svg", "scripts": "TooltipUI"}, {"id": "neighborhood_banner", "name": "Mahalle Adı", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/neighborhood_banner.png", "svg": "../01_Screens/SVG/08_World_System/neighborhood_banner.svg", "scripts": "NeighborhoodUI"}, {"id": "delivery_world_marker", "name": "Dünya Teslimat İşareti", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/delivery_world_marker.png", "svg": "../01_Screens/SVG/08_World_System/delivery_world_marker.svg", "scripts": "DeliveryIndicator"}, {"id": "cinematic_capture", "name": "Sinematik HUD", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/cinematic_capture.png", "svg": "../01_Screens/SVG/08_World_System/cinematic_capture.svg", "scripts": "CinematicCaptureHUD"}, {"id": "accessibility_colorblind", "name": "Renk Körlüğü Kontrolü", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/accessibility_colorblind.png", "svg": "../01_Screens/SVG/08_World_System/accessibility_colorblind.svg", "scripts": "AccessibilityManager"}, {"id": "localization_preview", "name": "TR/EN Yerelleştirme", "category": "08_World_System", "cn": "Dünya & Sistem", "png": "../01_Screens/PNG/08_World_System/localization_preview.png", "svg": "../01_Screens/SVG/08_World_System/localization_preview.svg", "scripts": "LocalizationTable"}];let category='all',query='',items=[],selected=0;
const categoryNames={'01_Menus':'Menüler','02_Vehicle':'Sürüş HUD','03_Navigation':'Navigasyon','04_Quests':'Görevler','05_Company':'Şirket & Filo','06_Smartphone':'Telefon','07_Progression':'İlerleme','08_World_System':'Dünya & Sistem'};
function render(){items=DATA.filter(v=>(category==='all'||v.category===category)&&(v.name+' '+v.id+' '+v.scripts).toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr')));document.getElementById('counter').textContent=items.length+' ekran';
document.getElementById('grid').innerHTML=items.map((v,i)=>`<article class="card" tabindex="0" role="button" aria-label="${v.name}" onclick="openItem(${i})" onkeydown="if(event.key==='Enter')openItem(${i})"><img src="${v.png}" loading="lazy" alt="${v.name}"><div class="lower"><h3>${v.name}</h3><div class="meta">${categoryNames[v.category]} • ${v.scripts}</div><div class="bottom"><span class="tag">1600 × 900</span><span class="svg">SVG + PNG ↗</span></div></div></article>`).join('');}
const tabs=document.getElementById('tabs');tabs.innerHTML=[['all','Tümü'],...Object.entries(categoryNames)].map(([id,n])=>`<button class="chip ${id===category?'active':''}" data-key="${id}">${n}</button>`).join('');tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;category=b.dataset.key;tabs.querySelectorAll('.chip').forEach(t=>t.classList.toggle('active',t===b));render()};document.getElementById('search').oninput=e=>{query=e.target.value;render()};
function openItem(i){if(!items.length)return;selected=(i+items.length)%items.length;let v=items[selected];document.getElementById('large').src=v.png;document.getElementById('large').alt=v.name;document.getElementById('modTitle').textContent=v.name;document.getElementById('modScript').textContent=v.scripts;document.getElementById('openSVG').href=v.svg;document.getElementById('dialog').classList.add('show')}
function closeItem(){document.getElementById('dialog').classList.remove('show')};document.getElementById('close').onclick=closeItem;document.getElementById('prev').onclick=()=>openItem(selected-1);document.getElementById('next').onclick=()=>openItem(selected+1);document.getElementById('dialog').onclick=e=>{if(e.target.id==='dialog')closeItem()};document.addEventListener('keydown',e=>{if(!document.getElementById('dialog').classList.contains('show'))return;if(e.key==='Escape')closeItem();if(e.key==='ArrowRight')openItem(selected+1);if(e.key==='ArrowLeft')openItem(selected-1)});render();
</script></body></html>
